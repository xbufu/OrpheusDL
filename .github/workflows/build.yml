name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-gui.txt
          pip install pyinstaller

      - name: Download ffmpeg for bundling
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          $probe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $exe.FullName bin\ffmpeg.exe
          Copy-Item $probe.FullName bin\ffprobe.exe
          Remove-Item -Recurse ffmpeg_tmp, ffmpeg.zip
        shell: pwsh

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean gui.spec

      - name: Prepare default config
        run: |
          New-Item -ItemType Directory -Force dist\OrpheusDL\_internal\config | Out-Null
          Copy-Item settings.json.example dist\OrpheusDL\_internal\config\settings.json
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --yes
        shell: pwsh

      - name: Build Windows installer
        run: python installer/build_installer.py --skip-pyinstaller --platform windows

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/OrpheusDL-Setup-*.exe


  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-gui.txt
          pip install pyinstaller

      - name: Download ffmpeg for bundling
        run: |
          mkdir -p bin
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ
          cp ffmpeg-*-amd64-static/ffmpeg bin/ffmpeg
          cp ffmpeg-*-amd64-static/ffprobe bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe
          rm -rf ffmpeg-*-amd64-static

      - name: Build with PyInstaller
        run: python -m PyInstaller --clean gui.spec

      - name: Build AppImage
        run: python installer/build_installer.py --skip-pyinstaller --platform linux --format appimage

      - name: Build deb
        run: python installer/build_installer.py --skip-pyinstaller --platform linux --format deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/OrpheusDL-x86_64.AppImage

      - name: Upload deb
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: dist/OrpheusDL-*.deb


  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/OrpheusDL-Setup-*.exe
            artifacts/linux-appimage/OrpheusDL-x86_64.AppImage
            artifacts/linux-deb/OrpheusDL-*.deb
          generate_release_notes: true
